name: Sync and deploy dashboard
on:
  push:
    branches: [main]
    paths-ignore: ["public/data/**", "docs/**", "**.md"]
  schedule:
    - cron: "0 1,3,6,8,10,12 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: Force full reconciliation
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: dashboard-data-and-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      sync-outcome: ${{ steps.sync.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/cache@v4
        with:
          path: |
            .cache/reports.json
            .cache/comments
          key: report-trees-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: report-trees-
      - name: Sync public GitCode data
        id: sync
        continue-on-error: true
        env:
          GITCODE_API_TOKEN: ${{ secrets.GITCODE_API_TOKEN }}
          FULL: ${{ inputs.full }}
        run: |
          if [ "$FULL" = "true" ]; then
            python -m collector.sync --full
          else
            python -m collector.sync
          fi
      - name: Validate publication payload
        run: python scripts/validate.py
      - run: npm run build
      - name: Persist observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/dashboard.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh GitCode observations [skip ci]"
            git pull --rebase origin main
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-diagnostics
          path: .cache/last-run.json
          retention-days: 30
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Surface synchronization failure after publishing retained data
        if: needs.build.outputs.sync-outcome == 'failure'
        run: |
          echo 'Synchronization failed; retained data and diagnostics have been published.'
          exit 1
