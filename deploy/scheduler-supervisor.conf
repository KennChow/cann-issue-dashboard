[program:cann-issue-dashboard-scheduler]
command=/usr/local/bin/python3 -u /home/developer/Workspace/cann-issue-dashboard/scripts/dispatch_scheduled.py --serve
directory=/home/developer/Workspace/cann-issue-dashboard
user=developer
environment=HOME="/home/developer",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=5
startretries=5
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/home/developer/Workspace/cann-issue-dashboard/.cache/scheduler.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
